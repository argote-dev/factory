name: factory_example
description: Provider adoption, generated modules and removal of Factory.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  factory: ^0.1.0
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
dev_dependencies:
  build_runner: ^2.15.1
  factory_generator: ^0.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
dependency_overrides:
  factory:
    path: ..
  factory_core:
    path: ../packages/factory_core
  factory_generator:
    path: ../packages/factory_generator
