name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - run: dart pub get
        working-directory: packages/factory_core
      - run: dart test
        working-directory: packages/factory_core
      - run: dart analyze
        working-directory: packages/factory_core
      - run: dart pub get
        working-directory: packages/factory_generator
      - run: dart test
        working-directory: packages/factory_generator
      - run: dart analyze
        working-directory: packages/factory_generator
      - run: flutter test
      - run: flutter analyze lib test
      - run: dart run build_runner build
        working-directory: example
      - run: git diff --exit-code -- example/lib/composition/registry.factory.dart
      - run: flutter test
        working-directory: example
      - run: flutter analyze
        working-directory: example
      - run: flutter build web
        working-directory: example
      - if: runner.os == 'macOS'
        run: flutter build macos
        working-directory: example
      - if: runner.os == 'Windows'
        run: flutter build windows
        working-directory: example

  runtime-minimum:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true
      - name: Prepare runtime-only package
        shell: bash
        run: |
          mkdir -p runtime_check/packages
          cp pubspec.yaml pubspec_overrides.yaml analysis_options.yaml runtime_check/
          cp -R lib test runtime_check/
          cp -R packages/factory_core runtime_check/packages/
      - run: flutter pub get
        working-directory: runtime_check
      - run: flutter test
        working-directory: runtime_check
      - run: flutter analyze lib test
        working-directory: runtime_check
      - run: dart pub get
        working-directory: packages/factory_core
      - run: dart test
        working-directory: packages/factory_core
      - run: dart analyze
        working-directory: packages/factory_core

  generator-minimum:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.0'
      - run: dart pub get
        working-directory: packages/factory_generator
      - run: dart test
        working-directory: packages/factory_generator
      - run: dart analyze
        working-directory: packages/factory_generator
