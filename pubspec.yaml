name: factory
description: Explicit, scoped dependency injection for Flutter applications using Provider.
version: 0.1.0
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'
dependencies:
  factory_core: ^0.1.0
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
dependency_overrides:
  factory_core:
    path: packages/factory_core
