name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: dart pub get
        working-directory: packages/factory_core
      - run: dart test
        working-directory: packages/factory_core
      - run: dart analyze
        working-directory: packages/factory_core
      - run: dart pub get
        working-directory: packages/factory_generator
      - run: dart test
        working-directory: packages/factory_generator
      - run: dart analyze
        working-directory: packages/factory_generator
      - run: flutter test
      - run: flutter analyze lib test
      - run: dart run build_runner build
        working-directory: example
      - run: git diff --exit-code -- example/lib/composition/registry.factory.dart
      - run: bash tool/verify_consumers.sh
      - run: flutter test
        working-directory: example
      - run: flutter analyze
        working-directory: example
      - run: flutter build web
        working-directory: example
      - if: runner.os == 'macOS'
        run: flutter build macos
        working-directory: example
      - if: runner.os == 'Windows'
        run: flutter build windows
        working-directory: example

  artifacts:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r tool/requirements.txt
      - run: python tool/verify_release.py --baseline-release --output build/acceptance/baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-evidence
          path: build/acceptance/baseline
      - run: python tool/verify_release.py --output build/acceptance/current
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-evidence
          path: build/acceptance/current

  runtime-minimum:
    needs: artifacts
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: current-evidence
          path: build/current
      - run: pip install -r tool/requirements.txt
      - run: python tool/verify_release.py --archives build/current/archives --runtime-only --lower-dependencies --output build/acceptance/runtime-minimum
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-minimum-evidence
          path: build/acceptance/runtime-minimum

  generator-minimum:
    needs: artifacts
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: current-evidence
          path: build/current
      - run: pip install -r tool/requirements.txt
      - run: python tool/verify_release.py --archives build/current/archives --generator-only --flutter-generation --output build/acceptance/generator-minimum
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator-minimum-evidence
          path: build/acceptance/generator-minimum
